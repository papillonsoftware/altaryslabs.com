<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  body{margin:0; background:#F6F2E9;}
  a{color:#B8791E;}
  a:hover{color:#8B5E1B;}
</style>
</helmet>
<div style="font-family:'DM Sans',sans-serif;">
  <dc-import name="Header" active="services" lang="{{ lang }}" onSetLang="{{ setLang }}" hint-size="100%,72px"></dc-import>

  <section style="padding:96px 64px 64px; background:#F6F2E9;">
    <div style="max-width:820px; margin:0 auto;">
      <p style="font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.35em; color:#B8791E; text-transform:uppercase; margin-bottom:16px;">{{ t.label }}</p>
      <h1 style="font-family:'Cormorant Garamond',serif; font-weight:300; font-size:clamp(32px,4vw,48px); color:#1A2740; margin:0 0 22px;">{{ t.title }}</h1>
      <p style="font-size:17px; color:#5B6472; line-height:1.75;">{{ t.intro }}</p>
    </div>
  </section>

  <section style="padding:0 64px 90px; background:#F6F2E9;">
    <div style="max-width:1000px; margin:0 auto;">
      <div style="background:#FFFFFF; border-radius:8px; padding:40px; border:1px solid rgba(26,39,64,.08); box-shadow:0 1px 3px rgba(26,39,64,.04);">
        <p style="font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.15em; color:#B8791E; text-transform:uppercase; margin:0 0 16px;">{{ t.approachLabel }}</p>
        <p style="font-size:15px; color:#3A4256; line-height:1.85; margin:0 0 28px;">{{ t.approachDesc }}</p>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <span style="font-family:'Space Mono',monospace; font-size:11px; color:#8B5E1B; background:rgba(200,146,42,.12); padding:6px 14px; border-radius:100px;">Java / Spring Boot</span>
          <span style="font-family:'Space Mono',monospace; font-size:11px; color:#8B5E1B; background:rgba(200,146,42,.12); padding:6px 14px; border-radius:100px;">React / TypeScript</span>
          <span style="font-family:'Space Mono',monospace; font-size:11px; color:#8B5E1B; background:rgba(200,146,42,.12); padding:6px 14px; border-radius:100px;">{{ t.cloudTag }}</span>
        </div>
      </div>
    </div>
  </section>

  <section style="padding:80px 64px; background:linear-gradient(135deg, #1A2740, #0F1724); text-align:center;">
    <h2 style="font-family:'Cormorant Garamond',serif; font-weight:300; font-size:clamp(24px,2.8vw,34px); color:#FAF7F2; margin:0 0 28px;">{{ t.ctaTitle }}</h2>
    <a href="contact.dc.html" style="background:#C8922A; color:#07111E; padding:16px 32px; border-radius:5px; text-decoration:none; font-weight:600; font-size:15px;">{{ t.ctaContact }}</a>
  </section>

  <dc-import name="Footer" lang="{{ lang }}" hint-size="100%,300px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const T = {
  fr: {
    label: 'Service', title: 'Développement sur mesure',
    intro: 'Nous concevons des applications web et mobiles, ainsi que des intégrations sur mesure, avec une architecture cloud-native pensée pour durer.',
    approachLabel: 'Notre approche',
    approachDesc: 'Applications web et mobiles, intégrations et connecteurs métier, portails sur mesure. Nous nous appuyons sur des technologies éprouvées, Java et Spring Boot côté serveur, React et TypeScript côté interface, avec une architecture cloud-native pour la fiabilité et la montée en charge.',
    cloudTag: 'Architecture cloud-native',
    ctaTitle: 'Discutons de votre besoin', ctaContact: 'Contactez notre équipe commerciale',
  },
  en: {
    label: 'Service', title: 'Custom Development',
    intro: 'We build web and mobile applications, along with custom integrations, on a cloud-native architecture designed to last.',
    approachLabel: 'Our approach',
    approachDesc: 'Web and mobile applications, business integrations and connectors, custom portals. We rely on proven technologies, Java and Spring Boot on the server side, React and TypeScript on the interface side, with a cloud-native architecture for reliability and scale.',
    cloudTag: 'Cloud-native architecture',
    ctaTitle: "Let's talk about your needs", ctaContact: 'Talk to our sales team',
  },
};
class Component extends DCLogic {
  state = { lang: (typeof localStorage !== 'undefined' && localStorage.getItem('altarys-lang')) || 'fr' };
  setLang = (l) => { this.setState({ lang: l }); try { localStorage.setItem('altarys-lang', l); } catch (e) {} };
  renderVals() { return { lang: this.state.lang, setLang: this.setLang, t: T[this.state.lang] }; }
}
</script>
</body>
</html>
